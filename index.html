<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dulce Descanso</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

  <body>
    <header>
      <h1>Dulce Descanso</h1>
      <p>Confort y calidad para tu hogar</p>
    </header>

    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <main>
      <section id="catalogo">
        <h2>Nuestros Productos</h2>

        <div class="catalogo">
          <div class="producto">
            <img src="acolchado1.jpeg" alt="Acolchado Premium Gris" />
            <h3>Acolchado Premium Gris</h3>
            <p class="descuento">10% OFF</p>
            <p class="precio">$60.000</p>
          </div>

          <div class="producto">
            <img src="acolchado2.jpeg" alt="Acolchado Suave Beige" />
            <h3>Acolchado Suave Beige</h3>
            <p class="descuento">10% OFF</p>
            <p class="precio">$50.000</p>
          </div>

          <div class="producto">
            <img src="acolchado3.png" alt="Acolchado Deluxe Blanco" />
            <h3>Acolchado Deluxe Blanco</h3>
            <p class="descuento">10% OFF</p>
            <p class="precio">$65.000</p>
          </div>
        </div>
      </section>

      <section id="contacto">
        <h2>Contacto</h2>

        <form action="https://formspree.io/f/mrejwvvz" method="POST">
          <input
            type="email"
            name="email"
            placeholder="Tu correo"
            required
          />

          <textarea
            name="message"
            placeholder="Tu consulta"
            required
          ></textarea>

          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer>
      <p>© 2026 Dulce Descanso</p>
    </footer>
  </body>
</html>
